# MODE=MySQL schakelt MySQL-compatibiliteit in zodat hetzelfde schema.sql ook met H2 gebruikt kan worden.
spring.datasource.url=jdbc:h2:mem:campus;MODE=MySQL
spring.datasource.username=test
spring.datasource.password=password

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none

# H2 is in-memory en moet daarom de SQL-bestanden bij elke start opnieuw laden.
spring.sql.init.mode=always